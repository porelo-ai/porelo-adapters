# The GraalVM the CI snapshots pin, installed on a GitHub runner and checked against its digest - so a
# job compiles with the same JDK a leg builds with, and never with whatever release a moving name ('25')
# resolved to that day. The pin lives in sokar-buildtools, in the published sokar-machines, and is moved
# by that repository's Machines workflow once a release is three days old.
#
# Bootstrapped from the runner's own Java 25 (JAVA_HOME_25_X64), which runs sokar-machines once to
# install the pinned one; nothing that JDK compiles is published. Needs the repository checked out.
name: Pinned GraalVM
description: Installs the GraalVM sokar-machines pins, checked against its digest, as JAVA_HOME for the rest of the job.
runs:
  using: composite
  steps:
    # What setup-graalvm's 'cache: maven' did.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: maven-${{ runner.os }}-

    - name: Install the pinned GraalVM
      shell: bash
      run: |
        set -eu
        if [ -z "${JAVA_HOME_25_X64:-}" ]; then
            echo "::error::this runner has no Java 25 to install the pinned GraalVM with (JAVA_HOME_25_X64)"
            exit 1
        fi
        export JAVA_HOME="$JAVA_HOME_25_X64"
        # sokar-machines from Central at the root pom's sokar.buildtools.version, run by that Java.
        ./mvnw -B -q -U -s settings.xml -N exec:exec@machines -Dmachines.args="jdk --github"
