# Builds the reader on every change to it: compiled, its unit tests run, its native executable built and packed as a
# .deb and an .rpm, which put it where Porelo finds it. A push to main publishes them to the snapshots channel, a tag
# v<version> to the releases channel; a release depends only on releases. Against porelo-build-api as a snapshot
# while it is developed (-U takes the newest), as the shared rules allow.
name: Build

on:
    push:
        branches: [main]
        tags: ['v*']
        # A change to documents alone is checked locally before the hand-over and by the Shared rules check once a day.
        # Workflows alone build nothing either: an action's move is checked by its pull request, and the next push with
        # content builds with it.
        paths-ignore: ['**.md', 'doc/**', 'issues/**', 'mkdocs.yml', '.github/**', 'porelo.yml']
    pull_request:
        # The image a Porelo task builds in changes no build here, and a workflow-only change is the Workflow check's.
        paths-ignore: ['porelo.yml', '.github/**']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build, packages and publish
        # Pinned, not ubuntu-latest: the packages' C library floor is measured on what this builds.
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            # Every commit, so the pushed range can be read.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            # check-package-version reads the built .rpm with rpm, which the runner is not promised to have.
            - name: rpm, to read the built package
              run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

            # Not -DskipTests: the dist profile's checks need the binary and the packages it is packed into - the reader
            # against the C library and zlib both declare, and the version both carry.
            - name: Build, unit tests, the native reader and its packages
              run: ./mvnw -B -U -s settings.xml -Pnative,dist verify -Dreader.snapshot.run=${{ github.run_number }}

            # A direct push to main never meets the pull request's check, so the push's own range is read here, by the
            # rule this commit carries. A tag checks the commit it names. A new branch or a branch pushed over has no start
            # this checkout holds, so its range starts at main; main itself cannot be pushed over.
            - name: The pushed commits' messages
              if: github.event_name == 'push'
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  set -eu
                  case "$PUSH_BEFORE" in
                      '') echo "::error::the push names no commit it started from"; exit 1 ;;
                  esac
                  start=$PUSH_BEFORE
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      start="$GITHUB_SHA~1"
                  elif ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                      if [ "$GITHUB_REF" = refs/heads/main ]; then
                          echo "::error::main moved from $PUSH_BEFORE, a commit this checkout does not hold"
                          exit 1
                      fi
                      start=origin/main
                  fi
                  ./mvnw -B -s settings.xml -N exec:exec@release -Drelease.args="check-commits $start..$GITHUB_SHA"

            - name: The reader answers as one
              run: |
                  set -eu
                  for forge in github forgejo; do
                      description="$(adapters/$forge/target/porelo-adapter-$forge describe)"
                      echo "$description"
                      echo "$description" | grep -q "\"forge\":\"$forge\""
                      echo "$description" | grep -q '"protocolVersion":2'
                  done

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages
                  path: |
                      adapters/github/target/*.deb
                      adapters/github/target/*.rpm
                      adapters/forgejo/target/*.deb
                      adapters/forgejo/target/*.rpm
                  if-no-files-found: error

            - name: Not publishing
              if: "!(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))"
              run: |
                  echo "Not publishing. This run is '${{ github.event_name }}' on '${{ github.ref }}', and only a push to main"
                  echo "or a tag v<version> publishes. The packages were built and checked here and are attached to this run."

            # A tag publishes a release, main a snapshot. A release is refused unless the tag is exactly 'v' plus the version
            # it carries and Porelo is a release too, and a version is never both at once.
            - name: Which channel
              id: channel
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  PORELO="$(sed -n 's|^        <porelo.version>\(.*\)</porelo.version>$|\1|p' pom.xml | head -1)"
                  [ -n "$PORELO" ] || { echo "::error::no porelo.version in pom.xml"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                          || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                      case "$VERSION" in
                          *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                      esac
                      case "$PORELO" in
                          *-SNAPSHOT) echo "::error::porelo.version $PORELO is a snapshot; a release is built against a released Porelo"; exit 1 ;;
                      esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                  else
                      case "$VERSION" in
                          *-SNAPSHOT) ;;
                          *) echo "::error::$VERSION on a branch would publish a release as a snapshot"; exit 1 ;;
                      esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                  fi
                  echo "  $VERSION -> $(tail -1 "$GITHUB_OUTPUT")"

            # Every -SNAPSHOT in the effective pom - dependencies, the imported BOM, plugins and their dependencies such as
            # porelo-release, inactive profiles too - refuses the tag.
            - name: A release depends only on releases
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              run: |
                  ./mvnw -B -s settings.xml help:effective-pom -Doutput=target/effective-pom.xml
                  ./mvnw -B -s settings.xml -N exec:exec@check-releases

            - name: Publish the contract suite to Central
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              env:
                  OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
                  OSS_SONATYPE_TOKEN: ${{ secrets.OSS_SONATYPE_TOKEN }}
              run: ./mvnw -B -s settings.xml -Pcentral-sonatype-release deploy

            # Curl alone, so no downloaded tool runs beside the token; the token reaches it as config on standard input,
            # so neither a file nor a command line holds it. A .deb without its properties is stored and never indexed.
            - name: Publish the packages
              timeout-minutes: 5
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -euo pipefail
                  case "$JF_URL" in
                      https://?*) ;;
                      *) echo "::error::variable JF_URL is '$JF_URL', not an https:// address the token may go to"; exit 1 ;;
                  esac
                  base="${JF_URL%/}/artifactory"
                  # A glob that matches several files would shift put's arguments and upload the wrong thing.
                  only() {
                      [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one package, matched: $*" >&2; exit 1; }
                      echo "$1"
                  }
                  declare -A deb rpm
                  for forge in github forgejo; do
                      deb[$forge]="$(only adapters/$forge/target/*.deb)"
                      rpm[$forge]="$(only adapters/$forge/target/*.rpm)"
                  done
                  if [ "$CHANNEL" = releases ]; then
                      # Read into a file, so an index that cannot be read stops the release rather than reading as
                      # "not published": a published release is never replaced, as on Central.
                      curl -sSfL --proto =https --proto-redir =https --max-time 60 -o "$RUNNER_TEMP/published-index" "$base/porelo-dist-deb/dists/releases/main/binary-amd64/Packages" \
                          || { echo "::error::the release index could not be read, so whether this release is published is unknown"; exit 1; }
                      for forge in github forgejo; do
                          if grep -qxF "Filename: pool/main/p/porelo-adapter-$forge/$(basename "${deb[$forge]}")" "$RUNNER_TEMP/published-index"; then
                              echo "::error::this $forge release is published already"; exit 1
                          fi
                      done
                  fi
                  [ -n "$JF_ACCESS_TOKEN" ] || { echo "::error::secret JF_ACCESS_TOKEN is not set"; exit 1; }
                  # Assigned first, so a checksum that cannot be computed stops here instead of sending an empty header,
                  # which curl drops; Artifactory checks the bytes against both. Only a 2xx is an upload: curl's -f
                  # passes a redirect, which put does not follow, so the token stays with this host.
                  put() {
                      local sha1 sha256 status
                      sha1="$(sha1sum "$1" | cut -d' ' -f1)"
                      sha256="$(sha256sum "$1" | cut -d' ' -f1)"
                      echo "  put   $2$(basename "$1")"
                      status="$(printf 'header = "Authorization: Bearer %s"\n' "$JF_ACCESS_TOKEN" \
                          | curl -fsS --proto =https --max-time 120 -K - -o /dev/null -w '%{http_code}' -T "$1" \
                              -H "X-Checksum-Sha1: $sha1" -H "X-Checksum-Sha256: $sha256" \
                              "$base/$2$(basename "$1")${3:+;$3}")"
                      case "$status" in
                          2??) ;;
                          *) echo "::error::Artifactory answered $status to the upload of $(basename "$1"), not a 2xx"; exit 1 ;;
                      esac
                  }
                  for forge in github forgejo; do
                      put "${deb[$forge]}" "porelo-dist-deb/pool/main/p/porelo-adapter-$forge/" \
                          "deb.distribution=${CHANNEL};deb.component=main;deb.architecture=amd64"
                      put "${rpm[$forge]}" "porelo-dist-rpm/${CHANNEL}/"
                  done

            # Uploaded is not installable. Read anonymously, as an installer sees it, into a variable before grep: grep
            # leaving a pipe early would fail curl under pipefail on a large index.
            - name: The package is indexed, not merely stored
              timeout-minutes: 12
              if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -euo pipefail
                  index="${JF_URL%/}/artifactory/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages"
                  for forge in github forgejo; do
                      set -- adapters/$forge/target/*.deb
                      [ "$#" = 1 ] && [ -f "$1" ] || { echo "::error::expected one $forge package, matched: $*"; exit 1; }
                      DEB="$(basename "$1")"
                      tries=0
                      indexed=false
                      while [ "$tries" -lt 20 ]; do
                          if packages="$(curl -sSfL --proto =https --proto-redir =https --max-time 10 "$index" 2>"$RUNNER_TEMP/index-error")"; then
                              if grep -qxF "Filename: pool/main/p/porelo-adapter-$forge/$DEB" <<< "$packages"; then
                                  echo "  OK    the Debian index lists $DEB"
                                  indexed=true
                                  break
                              fi
                              last="the index does not list it"
                          else
                              last="$(cat "$RUNNER_TEMP/index-error")"
                          fi
                          tries=$((tries + 1))
                          sleep 6
                      done
                      if [ "$indexed" != true ]; then
                          echo "::error::$DEB is not in $index after $tries reads; the last: $last"
                          exit 1
                      fi
                  done
